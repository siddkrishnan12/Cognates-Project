# Supported languages: Wiktionary language code -> data file, tree stage and epitran fallback.
# stage: the Index Diachronica stage id (tree/indo-european.json) whose target is this language.
#   Each stage matches the variety of the first IPA Wiktionary lists for the language
#   (English: Received Pronunciation; Sanskrit: Vedic).
# processes: side-branch process sections this language passes through (none yet).
# epitran: fallback grapheme-to-IPA code, or null when epitran lacks the language.
# epitran_native: (optional) epitran code for the native script, used when an entry has no
#   romanization for the Latin-script code to read.
# prefer_tag: (optional) Step 2 takes the first phonemic IPA carrying this Wiktionary tag,
#   falling back to the first phonemic IPA.
# prefer_tag_phonetic: (optional) when true, prefer_tag also matches phonetic [...] IPA,
#   after the phonemic ones (Persian: the `Iran` IPA is phonetic). Team decision 2026-11-27.
# cleanup: (optional) a table of replacements applied to the IPA in Step 2, turning narrow
#   phonetic transcription into the plain segments the reversed rules expect.
# stop_on_loan: (optional) when true, a noun whose Wiktionary etymology marks it as
#   borrowed stops at Step 1. Team decision 2026-11-27 (Persian).
en:
  name: English
  kaikki: English.jsonl
  stage: British-English
  processes: []
  epitran: null
  prefer_tag: Received-Pronunciation
got:
  name: Gothic
  kaikki: Gothic.jsonl
  stage: Gothic
  processes: []
  epitran: got-Latn
  epitran_native: got-Goth
non:
  name: Old Norse
  kaikki: OldNorse.jsonl
  stage: Old-Norse
  processes: []
  epitran: null
ofs:
  name: Old Frisian
  kaikki: OldFrisian.jsonl
  stage: Old-Frisian
  processes: []
  epitran: null
nl:
  name: Dutch
  kaikki: Dutch.jsonl
  stage: Modern-Dutch
  processes: []
  epitran: nld-Latn
sa:
  name: Sanskrit
  kaikki: Sanskrit.jsonl
  stage: Vedic-Sanskrit
  processes: []
  epitran: null
fa:
  name: Persian
  kaikki: Persian.jsonl
  stage: Modern-Iranian-Persian
  processes: []
  epitran: fas-Arab  # fallback for nouns without IPA; Persian script omits short vowels
  prefer_tag: Iran
  prefer_tag_phonetic: true
  cleanup: rules/cleanup/fa.yaml
  stop_on_loan: true
